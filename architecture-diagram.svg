<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Human-AI Handoff Copilot architecture</title>
  <desc id="desc">Architecture diagram showing a support case flowing into a handoff agent, Copilot Studio assets, approval card, and resume proof.</desc>
  <rect width="1280" height="720" fill="#f5f7fb"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2937">Human-AI Handoff Copilot</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="19" fill="#566273">Good agents know when to pause, preserve, and transfer control.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="260" height="330" rx="10" fill="#ffffff" stroke="#d8e0ea"/>
    <text x="98" y="215" font-size="24" font-weight="700" fill="#1f2937">Inputs</text>
    <text x="98" y="258" font-size="17" fill="#475467">support ticket</text>
    <text x="98" y="294" font-size="17" fill="#475467">policy source</text>
    <text x="98" y="330" font-size="17" fill="#475467">agent worklog</text>
    <text x="98" y="366" font-size="17" fill="#475467">required fields</text>
    <rect x="98" y="438" width="196" height="34" rx="17" fill="#f1ecff"/>
    <text x="116" y="461" font-size="15" font-weight="700" fill="#6941c6">business case packet</text>

    <rect x="420" y="170" width="310" height="330" rx="10" fill="#ffffff" stroke="#d8e0ea"/>
    <text x="448" y="215" font-size="24" font-weight="700" fill="#1f2937">Handoff Agent</text>
    <text x="448" y="258" font-size="17" fill="#475467">build packet</text>
    <text x="448" y="294" font-size="17" fill="#475467">validate required fields</text>
    <text x="448" y="330" font-size="17" fill="#475467">hash resume state</text>
    <text x="448" y="366" font-size="17" fill="#475467">block risky action</text>
    <text x="448" y="402" font-size="17" fill="#475467">create approval card</text>
    <rect x="448" y="438" width="174" height="34" rx="17" fill="#eaf0ff"/>
    <text x="466" y="461" font-size="15" font-weight="700" fill="#2563eb">Copilot-ready</text>

    <rect x="830" y="130" width="330" height="190" rx="10" fill="#ffffff" stroke="#d8e0ea"/>
    <text x="858" y="174" font-size="24" font-weight="700" fill="#1f2937">Copilot Studio Assets</text>
    <text x="858" y="217" font-size="17" fill="#475467">instructions</text>
    <text x="858" y="253" font-size="17" fill="#475467">action contracts</text>
    <text x="858" y="289" font-size="17" fill="#475467">adaptive approval card</text>

    <rect x="830" y="390" width="330" height="190" rx="10" fill="#ffffff" stroke="#d8e0ea"/>
    <text x="858" y="434" font-size="24" font-weight="700" fill="#1f2937">Resume Proof</text>
    <text x="858" y="477" font-size="17" fill="#475467">handoff packet</text>
    <text x="858" y="513" font-size="17" fill="#475467">quality report</text>
    <text x="858" y="549" font-size="17" fill="#475467">GitHub issue draft</text>

    <path d="M330 335 C370 335 390 335 420 335" fill="none" stroke="#6941c6" stroke-width="4"/>
    <path d="M730 285 C778 255 790 228 830 220" fill="none" stroke="#6941c6" stroke-width="4"/>
    <path d="M730 385 C778 425 790 492 830 502" fill="none" stroke="#6941c6" stroke-width="4"/>
    <polygon points="415,335 397,325 397,345" fill="#6941c6"/>
    <polygon points="825,221 806,213 809,234" fill="#6941c6"/>
    <polygon points="825,502 807,489 805,511" fill="#6941c6"/>

    <rect x="70" y="625" width="1090" height="54" rx="8" fill="#1f2937"/>
    <text x="98" y="659" font-size="19" fill="#ffffff">Boundary: verified local handoff agent; no live Copilot Studio execution or final GitHub issue submission claimed.</text>
  </g>
</svg>
